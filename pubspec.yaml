name: cosmic_wish
description: "Cosmic Wish - gửi điều ước vào vũ trụ."
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  just_audio: ^0.9.40
  flutter_animate: ^4.5.0
  http: ^1.2.2
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  file_picker: ^8.0.0
  share_plus: 12.0.2
  path_provider: ^2.1.5
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  mockito: ^5.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  generate: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon-1024.png"
  adaptive_icon_background: "assets/icons/adaptive_background.png"
  adaptive_icon_foreground: "assets/icons/adaptive_foreground.png"
