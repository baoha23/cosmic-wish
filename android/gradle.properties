org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.daemon.jvmargs=-Xmx2G
android.enableJetifier=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
# Force a single JVM target across Java + Kotlin tasks so plugins that
# default to 21 don't fail the build with "Inconsistent JVM-target
# compatibility detected for tasks 'compileDebugJavaWithJavac' (17) and
# 'compileDebugKotlin' (21)".
kotlin.jvm.target.validation.mode=warning
kotlin.compiler.jvmTarget=17
kotlin.compiler.execution.strategy=in-process
android.kotlinCompilerExtensionVersion=1.9.10
