# Giữ project Supabase không bị pause (free tier pause sau ~7 ngày
# không có API request). Mỗi ngày ping 1 request REST nhẹ — chỉ đọc
# 1 dòng anonymous_wishes, tốn gần như 0 tài nguyên.
#
# Lưu ý: GitHub tự tắt scheduled workflow nếu repo không có commit
# nào trong 60 ngày. Nếu thấy job ngừng chạy, chỉ cần push 1 commit
# bất kỳ rồi vào Actions bật lại.

name: Supabase keepalive

on:
  schedule:
    # 04:17 UTC hằng ngày (chọn phút lệch để đỡ đụng giờ cao điểm).
    - cron: '17 4 * * *'
  workflow_dispatch: # cho phép chạy thủ công để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/anonymous_wishes?select=id&limit=1"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "$url")
          echo "HTTP $code"
          # 200 = project đang sống. 429/5xx cũng chứng tỏ project
          # phản hồi (không pause) nên vẫn tính là thành công; chỉ fail khi
          # không kết nối được (project đã bị pause giữa chừng).
          if [ "$code" = "000" ]; then
            echo "Không kết nối được — project có thể đã bị pause."
            exit 1
          fi
